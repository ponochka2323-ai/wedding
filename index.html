<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алексей и Виктория — 17.04.2027</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f5f0e6;font-family:Georgia,serif}

  .slide{position:relative;width:100%;max-width:500px;margin:0 auto}
  .slide>img{width:100%;height:auto;display:block}

  /* ===== ОБЛОЖКА ===== */
  .cover{overflow:hidden}
  .balloon-wrap{position:absolute;width:60%;left:20%;top:2%;z-index:2;
                animation:sway 4s ease-in-out infinite}
  .balloon img{width:100%;display:block;mix-blend-mode:multiply}
  .cover.fly .balloon-wrap{animation:flyAway 1.5s ease-in forwards}

  @keyframes sway{
    0%,100%{transform:translateX(0) rotate(0)}
    50%{transform:translateX(10px) rotate(2.5deg)}
  }
  @keyframes flyAway{
    0%{transform:translateX(0) translateY(0) rotate(0) scale(1);opacity:1}
    100%{transform:translateX(40px) translateY(-160vh) rotate(14deg) scale(.7);opacity:0}
  }

  .cover-btn{position:absolute;top:65.5%;left:18%;width:63.5%;height:5.5%;
             background:transparent;border:0;cursor:pointer;z-index:3;
             font-size:0;color:transparent;border-radius:50px}
  .cover.fly .cover-btn{pointer-events:none}

  /* ===== ФОРМА ===== */
  .rsvp-form{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2}

  .f{position:absolute;left:23%;width:68%;background:transparent;border:0;
     border-bottom:1px solid rgba(196,184,154,0.4);
     font-family:Georgia,serif;font-size:18px;color:#3d4f2f;
     outline:none;padding:4px 0;resize:none;font-weight:500}
  .f::placeholder{color:#3d4f2f;opacity:0.9}
  select.f{appearance:none;cursor:pointer}
  select.f option{font-size:17px;color:#3d4f2f}
  textarea.f{height:5%;line-height:1.3;overflow:hidden}

  .f-name{top:26%}
  .f-att {top:36%}
  .f-num {top:46%}
  .f-diet{top:55%}
  .f-com {top:66%}

  .f-send{position:absolute;top:75%;left:15%;width:70%;height:6%;
          background:transparent;border:0;cursor:pointer;font-size:0;z-index:3}

  .thanks{display:none;position:absolute;top:42%;left:15%;width:70%;
          background:rgba(245,240,230,0.97);border:1px solid #c4b89a;
          padding:22px 18px;text-align:center;z-index:4;border-radius:6px}
  .thanks.show{display:block}
  .thanks h3{font-size:26px;font-style:italic;color:#3d4f2f;margin-bottom:8px}
  .thanks p{color:#5a6b4a;font-size:15px;line-height:1.4}
  .thanks a{color:#5a6b4a}

  @media (prefers-reduced-motion:reduce){
    .balloon-wrap{animation:none}
    .cover.fly .balloon-wrap{animation:none;opacity:0}
  }
</style>
</head>
<body>

<!-- 1. Обложка -->
<div class="slide cover" id="cover">
  <img src="slide1.jpg" alt="Алексей и Виктория">
  <div class="balloon-wrap"><div class="balloon"><img src="balloon.png" alt=""></div></div>
  <button class="cover-btn" onclick="openInvite()">Открыть приглашение</button>
</div>

<!-- 2–6. Макеты -->
<div class="slide"><img src="slide2.jpg" alt=""></div>
<div class="slide"><img src="slide3.jpg" alt=""></div>
<div class="slide"><img src="slide4.jpg" alt=""></div>
<div class="slide">
  <img src="slide5.jpg" alt="">
  <a href="https://yandex.ru/maps/?text=Ростов-на-Дону, улица Левобережная, 16"
     target="_blank" rel="noopener"
     style="position:absolute;top:60.5%;left:18%;width:63%;height:6%;z-index:2"></a>
</div>
<div class="slide"><img src="slide6.jpg" alt=""></div>

<!-- 7. Форма -->
<div class="slide">
  <img src="slide7.jpg" alt="Будем ждать вас">
  <form class="rsvp-form" id="rsvpForm" onsubmit="return sendForm(event)">
    <input class="f f-name" type="text" name="name" placeholder="Ваше имя" required>
    <select class="f f-att" name="attendance" required>
      <option value="">Будете ли вы с нами?</option>
      <option value="Да, буду">Да, буду</option>
      <option value="К сожалению, не смогу">К сожалению, не смогу</option>
    </select>
    <input class="f f-num" type="number" name="guests" min="1" max="20" placeholder="Количество гостей" required>
    <textarea class="f f-diet" name="diet" placeholder="Пищевые предпочтения или ограничения"></textarea>
    <textarea class="f f-com" name="comment" placeholder="Ваш комментарий"></textarea>
    <button class="f-send" type="submit">Подтвердить присутствие</button>
  </form>
  <div class="thanks" id="thanks">
    <h3>Спасибо!</h3>
    <p>Форма открыта в новой вкладке.<br>Пожалуйста, заполните её там 💚</p>
  </div>
</div>

<!-- 8. Финал -->
<div class="slide"><img src="slide8.jpg" alt=""></div>

<script>
  const GOOGLE_FORM = 'https://forms.gle/bbGbrwMjPcqbZT6i8';

  function openInvite(){
    document.getElementById('cover').classList.add('fly');
    setTimeout(function(){
      window.scrollBy({top:window.innerHeight,behavior:'smooth'});
    },1600);
  }

  function sendForm(e){
    e.preventDefault();
    var f = e.target;

    if(!f.name.value.trim()){
      alert('Пожалуйста, напишите ваше имя');
      f.name.focus();
      return false;
    }
    if(!f.guests.value || f.guests.value < 1){
      alert('Укажите количество гостей');
      f.guests.focus();
      return false;
    }

    // Открываем Google Form в новой вкладке
    window.open(GOOGLE_FORM, '_blank');

    // Показываем "Спасибо" на сайте
    document.getElementById('rsvpForm').style.display = 'none';
    document.getElementById('thanks').classList.add('show');

    return false;
  }
</script>

</body>
</html>
